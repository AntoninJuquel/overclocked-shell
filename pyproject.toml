[project]
name = "overclocked-shell"
version = "0.1.0"
description = "Your Ghost on steroids: a Destiny 2 companion for Claude Code"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    "mcp>=2.3",
    "python-dotenv>=1.0",
]

[project.scripts]
shell = "shell.cli:main"
shell-mcp = "shell.mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
